<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filmhyllan</title>
<style>
  :root {
    --bg: #f6f4ef; --surface: #ffffff; --text: #1d1b18; --muted: #6b665d;
    --line: #e2ddd3; --accent: #b4441f; --ok: #2f7d4f; --no: #a33a3a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14130f; --surface: #1e1c18; --text: #ece8df; --muted: #9c968a;
      --line: #2f2c26; --accent: #e07a4f; --ok: #5cbf86; --no: #e07070; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg);
    border-bottom: 1px solid var(--line); padding: 12px 16px; }
  h1 { margin: 0 0 8px; font-size: 20px; letter-spacing: -0.01em; }
  h1 small { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 8px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  input, select { font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0; }
  input[type=search] { flex: 1 1 200px; }
  label.check { display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  main { padding: 16px; }
  .count { color: var(--muted); margin: 0 0 12px; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    overflow: hidden; display: flex; flex-direction: column; text-decoration: none; color: inherit; }
  .card:hover { border-color: var(--accent); }
  .cover { aspect-ratio: 2 / 3; background: var(--line); display: grid; place-items: center;
    overflow: hidden; }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover .ph { padding: 10px; text-align: center; font-weight: 600; color: var(--muted); }
  .meta { padding: 8px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .title { font-weight: 600; font-size: 14px; line-height: 1.25; }
  .sub { color: var(--muted); font-size: 12px; }
  .avail { font-size: 12px; font-weight: 600; margin-top: auto; }
  .avail.ok { color: var(--ok); } .avail.no { color: var(--no); }
  .rating { font-size: 12px; color: var(--muted); }
  .rating b { color: var(--text); }
  dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
    color: var(--text); padding: 0; width: min(560px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgb(0 0 0 / 0.55); }
  .dlg { display: grid; grid-template-columns: 140px 1fr; gap: 16px; padding: 16px; }
  .dlg img { width: 100%; border-radius: 6px; }
  .dlg h2 { margin: 0 0 4px; font-size: 18px; }
  .dlg p { margin: 8px 0; }
  .dlg ul { margin: 6px 0; padding-left: 18px; font-size: 13px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .btn { display: inline-block; padding: 7px 12px; border-radius: 6px; text-decoration: none;
    border: 1px solid var(--line); color: var(--text); background: var(--bg); font: inherit; cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (max-width: 480px) { .dlg { grid-template-columns: 1fr; } .dlg img { max-width: 160px; } }
  footer { padding: 16px; color: var(--muted); font-size: 12px; }
  .more { display: block; margin: 20px auto; padding: 8px 18px; font: inherit; cursor: pointer;
    background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 6px; }
  .err { color: var(--no); }
</style>
</head>
<body>
<header>
  <h1>Filmhyllan <small id="stamp"></small></h1>
  <div class="controls">
    <input type="search" id="q" placeholder="Sök titel, skådespelare…">
    <select id="genre"><option value="">Alla genrer</option></select>
    <select id="branch"><option value="">Alla bibliotek</option></select>
    <select id="lang"><option value="">Alla språk</option></select>
    <select id="sort">
      <option value="rating">Högst betyg</option>
      <option value="new">Nyast</option>
      <option value="old">Äldst</option>
      <option value="title">Titel A–Ö</option>
      <option value="copies">Flest exemplar</option>
    </select>
    <label class="check"><input type="checkbox" id="avail"> Inne nu</label>
    <label class="check"><input type="checkbox" id="covers"> Bara med omslag</label>
  </div>
</header>
<main>
  <p class="count" id="count">Laddar…</p>
  <div class="grid" id="grid"></div>
  <button class="more" id="more" hidden>Visa fler</button>
</main>
<dialog id="dlg"></dialog>
<footer>Data från Stockholms stadsbibliotek. Filmdata och betyg från TMDb. This product uses the TMDB API but is not endorsed or certified by TMDB.</footer>
<script>
const PAGE = 120;
const $ = (id) => document.getElementById(id);
let films = [], shown = PAGE;

const norm = (s) => (s || '').toLocaleLowerCase('sv');
const yearOf = (f) => parseInt(String(f.tmdb?.released || f.year || '').match(/\d{4}/)?.[0] || '0', 10);
const coverOf = (f) => f.cover || f.tmdb?.poster || null;
// Bayesian average: pull low-vote ratings toward 6.5
const wr = (f) => f.tmdb?.rating ? (f.tmdb.votes * f.tmdb.rating + 50 * 6.5) / (f.tmdb.votes + 50) : 0;

// The library often has several records for one film (DVD + Blu-ray, re-releases).
// Merge by TMDb id; unmatched records only when title + year are identical.
function dedupe(list) {
  const groups = new Map();
  for (const f of list) {
    const k = f.tmdb ? `tmdb:${f.tmdb.kind}:${f.tmdb.id}` : `lib:${norm(f.title).trim()}|${f.year}`;
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(f);
  }
  return [...groups.values()].map((eds) => {
    if (eds.length === 1) return { ...eds[0], editions: eds };
    eds.sort((a, b) => b.availableNow - a.availableNow || b.copies - a.copies);
    const byBranch = new Map();
    for (const e of eds) for (const h of e.holdings) {
      const m = byBranch.get(h.branch) || { branch: h.branch, total: 0, available: 0, reservable: false };
      m.total += h.total || 0; m.available += h.available || 0; m.reservable ||= h.reservable;
      byBranch.set(h.branch, m);
    }
    const uniq = (xs) => [...new Set(xs.filter(Boolean))];
    return {
      ...eds[0],
      editions: eds,
      cover: eds.find((e) => e.cover)?.cover || null,
      format: uniq(eds.map((e) => e.format)).join(' / '),
      genre: uniq(eds.flatMap((e) => e.genre)),
      languages: uniq(eds.flatMap((e) => e.languages)),
      actors: uniq(eds.flatMap((e) => e.actors)),
      holdings: [...byBranch.values()],
      copies: eds.reduce((s, e) => s + e.copies, 0),
      availableNow: eds.reduce((s, e) => s + e.availableNow, 0),
    };
  });
}

function fillSelect(el, values) {
  for (const [v, n] of values) el.add(new Option(`${v} (${n})`, v));
}
function tally(fn) {
  const m = new Map();
  for (const f of films) for (const v of fn(f)) if (v) m.set(v, (m.get(v) || 0) + 1);
  return [...m].sort((a, b) => b[1] - a[1]);
}

function filtered() {
  const q = norm($('q').value), g = $('genre').value, b = $('branch').value, l = $('lang').value;
  const onlyAvail = $('avail').checked, onlyCovers = $('covers').checked;
  let list = films.filter((f) => {
    if (g && !f.genre.includes(g)) return false;
    if (l && !f.languages.includes(l)) return false;
    if (onlyCovers && !coverOf(f)) return false;
    if (b) {
      const h = f.holdings.find((h) => h.branch === b);
      if (!h || (onlyAvail && !h.available)) return false;
    } else if (onlyAvail && !f.availableNow) return false;
    if (q && !norm([f.title, f.originalTitle, ...f.actors].join(' ')).includes(q)) return false;
    return true;
  });
  const s = $('sort').value;
  const cmp = {
    new: (a, b) => yearOf(b) - yearOf(a),
    old: (a, b) => (yearOf(a) || 9999) - (yearOf(b) || 9999),
    title: (a, b) => a.title.localeCompare(b.title, 'sv'),
    copies: (a, b) => b.copies - a.copies,
    // weighted so a 9.0 from 3 votes doesn't top the list
    rating: (a, b) => wr(b) - wr(a),
  }[s];
  return list.sort(cmp);
}

function card(f) {
  const b = $('branch').value;
  const h = b ? f.holdings.find((h) => h.branch === b) : null;
  const avail = h ? h.available : f.availableNow;
  const copies = h ? h.total : f.copies;
  const where = f.holdings.filter((h) => h.available).map((h) => h.branch).join(', ');
  const a = document.createElement('a');
  a.className = 'card'; a.href = f.url;
  a.title = where ? `Inne på: ${where}` : 'Inte inne just nu';
  a.onclick = (e) => { e.preventDefault(); openDetail(f); };
  const cover = document.createElement('div'); cover.className = 'cover';
  const src = coverOf(f);
  if (src) {
    const img = new Image(); img.loading = 'lazy'; img.alt = ''; img.src = src;
    img.onerror = () => {
      if (f.tmdb?.poster && img.src !== f.tmdb.poster) { img.src = f.tmdb.poster; return; }
      cover.innerHTML = ''; cover.append(ph(f.title));
    };
    cover.append(img);
  } else cover.append(ph(f.title));
  const meta = document.createElement('div'); meta.className = 'meta';
  meta.innerHTML = `<div class="title"></div><div class="sub"></div><div class="rating"></div><div class="avail"></div>`;
  meta.children[0].textContent = f.title;
  meta.children[1].textContent = [yearOf(f) || null, f.format?.replaceAll('Film, ', ''), f.genre.filter((g) => g !== 'Långfilmer')[0]].filter(Boolean).join(' · ');
  if (f.tmdb?.rating) meta.children[2].innerHTML = `★ <b>${f.tmdb.rating.toFixed(1)}</b> (${f.tmdb.votes.toLocaleString('sv')})`;
  else meta.children[2].remove();
  const av = meta.querySelector('.avail');
  av.className = 'avail ' + (avail ? 'ok' : 'no');
  av.textContent = copies ? `${avail}/${copies} inne` : 'Inga exemplar';
  a.append(cover, meta);
  return a;
}
function openDetail(f) {
  const t = f.tmdb, dlg = $('dlg');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
  const branches = f.holdings.slice().sort((a, b) => b.available - a.available)
    .map((h) => `<li>${esc(h.branch)}: ${h.available ? `<b>${h.available}/${h.total} inne</b>` : `0/${h.total} inne`}</li>`).join('');
  const src = coverOf(f);
  dlg.innerHTML = `<div class="dlg">
    <div>${src ? `<img src="${esc(src)}" alt="">` : ''}</div>
    <div>
      <h2>${esc(f.title)}</h2>
      <div class="sub">${esc([yearOf(f) || null, t?.runtime ? `${t.runtime} min` : null, f.format?.replaceAll('Film, ', '')].filter(Boolean).join(' · '))}</div>
      ${t?.rating ? `<div class="rating">★ <b>${t.rating.toFixed(1)}</b> på TMDb (${t.votes.toLocaleString('sv')} röster)</div>` : ''}
      ${t?.overview ? `<p>${esc(t.overview)}</p>` : ''}
      ${f.actors.length ? `<div class="sub">Med: ${esc(f.actors.slice(0, 5).join(', '))}</div>` : ''}
      <ul>${branches || '<li>Inga exemplar</li>'}</ul>
      ${f.editions.length > 1 ? `<div class="sub">${f.editions.length} utgåvor, reservera en:</div><ul>${f.editions.map((e) =>
        `<li><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc([e.format?.replaceAll('Film, ', ''), e.year].filter(Boolean).join(', '))}</a>: ${e.availableNow}/${e.copies} inne</li>`).join('')}</ul>` : ''}
      <div class="actions">
        <a class="btn primary" href="${esc(f.editions[0].url)}" target="_blank" rel="noopener">Reservera${f.editions.length > 1 ? ' (mest inne)' : ''}</a>
        ${t?.trailer ? `<a class="btn" href="${esc(t.trailer)}" target="_blank" rel="noopener">▶ Trailer</a>` : ''}
        ${t ? `<a class="btn" href="https://www.themoviedb.org/${t.kind}/${t.id}" target="_blank" rel="noopener">TMDb</a>` : ''}
        <button class="btn" onclick="this.closest('dialog').close()">Stäng</button>
      </div>
    </div></div>`;
  dlg.showModal();
}
$('dlg').addEventListener('click', (e) => { if (e.target.id === 'dlg') e.target.close(); });
function ph(t) { const d = document.createElement('div'); d.className = 'ph'; d.textContent = t; return d; }

function render() {
  const list = filtered();
  $('count').textContent = `${list.length.toLocaleString('sv')} filmer`;
  const grid = $('grid'); grid.replaceChildren(...list.slice(0, shown).map(card));
  $('more').hidden = shown >= list.length;
}
const reset = () => { shown = PAGE; render(); };

fetch('data/films.json').then((r) => r.json()).then((d) => {
  // zero-copy records (withdrawn/lost) can't be borrowed: drop them after merging editions
  films = dedupe(d.films).filter((f) => f.copies > 0);
  $('stamp').textContent = `${films.length.toLocaleString('sv')} filmer · hämtad ${new Date(d.fetchedAt).toLocaleString('sv')}`;
  fillSelect($('genre'), tally((f) => f.genre));
  fillSelect($('branch'), tally((f) => f.holdings.map((h) => h.branch)).sort((a, b) => a[0].localeCompare(b[0], 'sv')));
  fillSelect($('lang'), tally((f) => f.languages));
  for (const id of ['q', 'genre', 'branch', 'lang', 'sort', 'avail', 'covers'])
    $(id).addEventListener(id === 'q' ? 'input' : 'change', reset);
  $('more').onclick = () => { shown += PAGE; render(); };
  render();
}).catch((e) => { $('count').innerHTML = `<span class="err">Kunde inte läsa data/films.json. Kör <code>node scripts/fetch.mjs</code> och servera mappen (t.ex. <code>npx serve</code>).</span>`; console.error(e); });
</script>
</body>
</html>
